<body>
    <header>
        <img src="assets/img/logo-horizontal.png" alt="">
    </header>

    <main class="main">
        <div class="cadastro">
            <div class="perfil">
                <img src="../assets/img/fotinhoDePerfil.png" alt="">
            </div>
            <div class="title">
                <h1 class="titulo">Crie <span>sua</span> conta</h1>
            </div>
            <div class="main-subtitle">
                <p>Preencha os dados abaixo para começar a <br>monitorar seus equipamentos</p>
            </div>
            <div class="formulario">
                <div class="campo">
                    <span>Nome Completo:</span>
                    <input id="nome_input" type="text" placeholder="Nome Completo">
                </div>
                <div class="campo">
                    <span>Código de Ativação:</span>
                    <input id="codigo_input" type="text" placeholder="Código de Ativação">
                </div>
                <div class="campo">
                    <span>Email Corporativo:</span>
                    <input id="email_input" type="text" placeholder="Email Corporativo">
                </div>
                <div class="campo">
                    <span>Senha:</span>
                    <input id="senha_input" type="password" placeholder="******">
                </div>
                <div class="campo">
                    <span>Confirmar Senha:</span>
                    <input id="ConfirmarSenha_input" type="password" placeholder="******">
                </div>
                <button class="botao" onclick="cadastrar()">Criar Conta</button>
                <div id="div_mensagem"></div>
                <div class="final">
                    <p>Já tem uma conta?
                        <a href="./login.html">Entrar</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>

        function validarCadastro() {
            let nome = nome_input.value;
            let email = email_input.value;
            let senha = senha_input.value;
            let Confirmar = ConfirmarSenha_input.value
            let codigoAtivacao = codigo_input.value

            div_mensagem.innerHTML = "";

            if (nome.trim() == "" || email.trim() == "" || senha.trim() == '' || Confirmar.trim() == '' || codigoAtivacao.trim() == '') {
                div_mensagem.style.color = "white";
                div_mensagem.innerHTML = "⚠️ Preencha todos os campos para continuar!";
                return false;
            }
            if (email.indexOf("@") == -1 || email.indexOf(".") == -1) {
                div_mensagem.style.color = "white";
                div_mensagem.innerHTML = "⚠️ Por favor, insira um e-mail válido.";
                return false;
            }
            if (senha.length < 6) {
                div_mensagem.style.color = "white";
                div_mensagem.innerHTML = "⚠️ A senha deve ter pelo menos 6 caracteres.";
                return false;
            }
            if (Confirmar != senha) {
                div_mensagem.style.color = "white";
                div_mensagem.innerHTML = "⚠️ As senhas não coincidem.";
                return false;
            }
            else {
                div_mensagem.style.color = "white";
                div_mensagem.innerHTML = `✅ Cadastro realizado! ${nome}!`;
            }

            return true;
        }

        function cadastrar() {
            let nome = nome_input.value;
            let email = email_input.value;
            let senha = senha_input.value;
            let Confirmar = ConfirmarSenha_input.value
            let codigoAtivacao = codigo_input.value

            div_mensagem.innerHTML = "";
            
            fetch(`/empresas/buscarEmpresaPorCodigo/${codigoAtivacao}`).then(response => {
                if (response.ok) {
                    console.log('entrou')
                    response.json().then(resposta => {
                        let fkEmpresa = resposta[0].id
                        if (validarCadastro()) {
                            console.log('entrou2')
                            fetch(`/usuarios/cadastrar`, {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    emailServer: email,
                                    senhaServer: senha,
                                    nomeServer: nome,
                                    fkEmpresaServer: fkEmpresa
                                })
                            }).then(response => {
                                console.log('entrou3')

                                if (response.ok) {
                                    console.log("Cadastro realizado")
                                    alert('Cadastro realizado')
                                    window.location.href = 'login.html'
                                } else {
                                    throw "Houve um erro ao realizar o cadastro"
                                }
                            }).catch(erro => {
                                console.error("Ocorreu um erro ao cadastrar usuario: ", erro)
                            })
                        } else {
                            console.error('Impossível realizar o cadastro, campos inválidos.')
                        }
                    })

                } else {
                    throw 'Houve um erro ao buscar a empresa'
                }
            }).catch(erro => {
                console.error("Ocorreu um erro: ", erro)
            })


            return false;
        }
