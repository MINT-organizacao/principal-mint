<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="shortcut icon" href="../assets/img/favicon.ico" type="image/x-icon">

    <title>Dashboard</title>

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />

</head>
<body>
    <aside>
        <div class="top">
            <img src="../assets/img/logo.png">
        </div>
        <div class="links">
            <div class="link"><span>Home</span></div>
            <div class="link"><span>Equipamentos</span></div>
            <div class="link"><span>Relatórios</span></div>
            <div class="link"><span>Alertas</span></div>
        </div>
        <div class="btnLogout">
            <button>Sair</button>
        </div>
    </aside>
    <main>
        <div class="kpis">
            <div class="kpi">
                <div class="kpi-title">Máquinas Cadastradas:</div>
                <div class="kpi-main" id="totalKpi">0</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Ativas:</div>
                <div class="kpi-main" id="ativasKpi">0</div>
            </div>
            <div class="kpi">
                <div class="kpi-title">Inativas:</div>
                <div class="kpi-main" id="inativasKpi">0</div>
            </div>
        </div>

        <div class="list">
            <div class="title">Máquinas listadas:</div>
            <div class="top">
                <div class="search">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" placeholder="Ex: Terminal-02">
                </div>
                <div class="opt">
                    <button><i class="ph ph-funnel"></i></button>
                    <button onclick="openCreate()" id="addBtn"><i class="ph ph-plus-circle"></i></button>
                </div>
            </div>
            <div class="itens" id="itens">
                
            </div>
        </div>
    </main>

    <div class="modal" id="create">
        <div class="wrapper" id="createWrapper">            
        </div>
    </div>

    <div class="modal" id="update">
        <div class="wrapper" id="uptWrapper">
            
        </div>
    </div>

    <div class="modal" id="remove">
        <div class="wrapper">
            <i class="ph ph-x" onclick="closeModal('remove')"></i>
            <div class="remove">
                <p>Você deseja remover mesmo?</p>
                <div class="btns">
                    <button id="rmYes">Sim</button>
                    <button onclick="closeModal('remove')" id="rmNo">Não</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    let uptComponentes = [];
    let addComponentes = [];
    let equipamentos = [];

    // verifica se está logado

    if (sessionStorage.getItem("ID_USUARIO") == null) {
        window.location = '../';
    }

    // funcão "init" da página

    window.onload = () => {
        list();
        getKpis();
    };

    // abertura/fechamento das janelas modais

    function openUpdate(id) {
        mountUpdate(id);

        let div = document.getElementById('update');
        div.style.display = "flex";
    }

    function openCreate(){
        mountCreate();

        let div = document.getElementById('create')
        div.style.display = "flex";
    }

    function openRemove(mac){
        remove.style.display = 'flex';

        rmYes.addEventListener('click', () => {
            remover(mac);
            closeModal('remove');
            location.reload();
        })
    }

    function closeModal(windowName) {
        let mod = document.getElementById(`${windowName}`);
        mod.style.display = "none";
    }

    // adicionar e remover componentes no equipamento

    function addComponente(windowName) {
        if(!(document.getElementById("addSel") || document.getElementById("uptSel"))) return; 

        if (windowName == 'upt') {
            let obj = {
                id: uptSel.value,
                limite: uptLim.value
            }
            if (uptComponentes.some(comp => comp.id === obj.id)) return;
            uptComponentes.push(obj);
            uptComponent.innerHTML += uptSel.options[uptSel.selectedIndex].dataset.nome + ": " + obj.limite + "<br>";
        }        

        let obj = {
            id: addSel.value,
            limite: addLim.value
        }
        if (addComponentes.some(comp => comp.id === obj.id)) return;
        addComponentes.push(obj);
        addComponent.innerHTML += addSel.options[addSel.selectedIndex].dataset.nome + ": " + obj.limite + "<br>";
    }

    function rmComponente(windowName) {
        if (windowName == 'upt') {
            uptComponent.innerHTML = "";
            uptComponentes = [];
            return;
        }
        addComponentes = [];
        addComponent.innerHTML = "";
    }

    // requisicao para montar janelas modais (create/update)

    async function mountUpdate(id) {
        
        let equip = {};

        for(let i = 0; i < equipamentos.length; i++){
            if(equipamentos[i].id == id) equip = equipamentos[i]; break;
        }

        let txt = '';

        for(let j = 0; j < equip.componentes.length; j++){
            txt += `${equip.componentes[j].nome_comp}: ${parseInt(equip.componentes[j].limite_maximo)} <br>`;
            uptComponentes.push(equip.componentes[j]);
        }

        let html = `
            <i class="ph ph-x" onclick="closeModal('update')"></i>
            <div class="form">
                <p style="text-align: center; font-weight: bold;">Edite os campos</p>
                <div class="inputs">
                    <input type="text" placeholder="Apelido" value="${equip.nome_equipamento}" id="uptInNome">
                    <input type="text" placeholder="Mac Adress" value="${equip.mac_address}" id="uptInMac">
                    <div class="componentes">
                        <p style="font-size: 1.5vh;">Selecione os componentes</p>
                        <div class="choice">
                            <select id="uptSel">
                                <option value="CPU">CPU</option>
                                <option value="RAM">RAM</option>
                                <option value="Disco">Disco</option>
                            </select>
                            <div class="btns">
                                <button onclick="addComponente('upt')">+</button>
                                <button onclick="rmComponente('upt')">-</button>
                            </div>    
                        </div>
                        <p id="uptComponent" style="color: #fff;">${txt}</p>
                    </div>
                    <button onclick="update()">Editar</button>
                </div>
            </div>
        `

        uptWrapper.innerHTML = html;
    }

    async function mountCreate(){
        let response = await fetch('/equipamento/getAllComponentes');
        let data = await response.json();

        let opt = ""

        for(let i = 0; i < data.length; i++){
            opt += `<option value="${data[i].id}" data-nome="${data[i].nome_comp}">${data[i].nome_comp}</option>`
        }
        

        let html = `
            <i class="ph ph-x" onclick="closeModal('create')"></i>
            <div class="form">
                <p style="text-align: center; font-weight: bold;">Preencha todos<br>os campos</p>
                <div class="inputs">
                    <input type="text" placeholder="Apelido" id="addApelidoIn">
                    <input type="text" placeholder="Mac Adress" id="addMacAddressIn">
                    <div class="componentes">
                        <p style="font-size: 1.5vh;">Selecione os componentes</p>
                        <div class="choice">
                            <select id="addSel">
                                ${opt}
                            </select>
                            <input type="text" id="addLim" placeholder="Ex: 70">
                            <div class="btns">
                                <button onclick="addComponente('add')">+</button>
                                <button onclick="rmComponente('add')">-</button>
                            </div>
                        </div>
                        <p id="addComponent" style="color: #fff;"></p>
                    </div>
                    <button onclick="create()">Enviar</button>
                </div>
            </div>
        `
        
        createWrapper.innerHTML = html;
    }
    
    // 

   function mountList() {
        const itensContainer = document.getElementById("itens");
        itensContainer.innerHTML = ""; 

        for (let i = 0; i < equipamentos.length; i++) {
            let txt = '';
            
            if (equipamentos[i].componentes) {
                for (let j = 0; j < equipamentos[i].componentes.length; j++) {
                    txt += equipamentos[i].componentes[j].nome_comp + " ";
                }
            }

            let html = `
                <div class="item" id="${equipamentos[i].id}">
                    <div class="wrapper">
                        <div class="info">
                            <p>${equipamentos[i].nome_equipamento}</p>
                            <p>${txt}</p>
                        </div>
                        <div class="actions">
                            <button onclick="openUpdate(${equipamentos[i].id})" id="uptBtn"><i class="ph ph-note-pencil"></i></button>
                            <button onclick="openRemove('${equipamentos[i].mac_address}')"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;

            itensContainer.innerHTML += html;
        }
    }

    async function list() {
        await buscarEquip();
        mountList();
    }
    
    async function buscarCompPorEquip(equipamentosList) {
        const promises = equipamentosList.map(equip => 
            fetch(`/equipamento/buscarCompPorEquip/${equip.id}`)
                .then(response => response.ok ? response.json() : [])
                .then(data => {
                    equip.componentes = data;
                })
                .catch(err => {
                    console.error("Erro ao buscar componentes:", err);
                    equip.componentes = [];
                })
        );
        
        await Promise.all(promises);
    }

    async function buscarEquip() {
        try {
            const response = await fetch(`/equipamento/listar/${sessionStorage.getItem('ID_EMPRESA')}`);
            if (response.ok) {
                equipamentos = await response.json();
                await buscarCompPorEquip(equipamentos);
            }
        } catch (err) {
            console.error("Erro ao buscar equipamentos:", err);
        }
    }

    // requisições para o crud e kpis

    async function create() {
        try {
            let nome = addApelidoIn.value;
            let mac = addMacAddressIn.value;

            let res = await fetch('/equipamento/cadastrar', {
                method: "POST",
                headers: {
                    "Content-type":"application/json"
                },
                body:JSON.stringify({
                        nome: nome,
                        mac_address: mac,
                        fk_empresa: sessionStorage.getItem("ID_EMPRESA")
                })
            })

            let data = await res.json();

            await fetch('/equipamento/createManyEquipComp', {
                method: 'POST',
                headers: {
                    "Content-type":"application/json",
                },
                body:JSON.stringify({
                    comps: addComponentes,
                    fk_equipamento: data.insertId
                })
            })

            await location.reload();
        } catch (error) {
            console.log(error);
        }
    }

    async function update() {
        try {
            let res = await fetch('/', {
                method: "PUT",
                headers: {
                    "Content-type":"application/json"
                },
                body: {
                    nome: uptInNome.value,
                    mac_address: uptInMac,
                    fk_empresa: sessionStorage.getItem("ID_EMPRESA")
                }
            })

            let data = await res.json()

            

        } catch (err) {
            console.log(err)
        }
    }

    async function remover(mac) {
        await fetch('/equipamento/deletar', {
            method:"DELETE",
            headers:{
                "Content-type":"application/json"
            },
            body:JSON.stringify({
                mac_address: mac,
                fk_empresa: sessionStorage.getItem("ID_EMPRESA")
            })
        })
    }

    async function  getKpis() {
        let response = await fetch(`/equipamento/getKpis/${sessionStorage.getItem("ID_EMPRESA")}`);
        let data =  await response.json();

        totalKpi.innerHTML = data[0].total;
        ativasKpi.innerHTML = data[0].ativos;
        inativasKpi.innerHTML = data[0].inativos;
    }

</script>
