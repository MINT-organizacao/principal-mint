<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINT</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="../public/assets/img/favicon.ico" type="image/x-icon">
</head>

<body>
    <header class="header">

        <div class="logo1"></div>
        <div class="logo2"></div>
        <div class="logo3"></div>

        <div class="title">MINT</div>

        <div class="logo-title">
            Monitoring & Infrastructure Technology
        </div>
    </header>


    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="titulo-login">
            <h1>Bem-Vindo <span>de volta!</span></h1>
            <p>Acesse sua conta para continuar
                monitorando seus equipamentos.</p>
        </div>
            
        <div class="formulario">
            <div class="campo">
                <span>Email<i class="fa-solid fa-user"></i></span>
                <input placeholder="Usuário" type="email" id="ipt_email">
            </div>
            <div class="campo">
                <span>Senha<i class="fa-solid fa-lock"></i></span>
                <input placeholder="*******" type="password" id="ipt_senha">
            </div>

            <div class="esqueceu">
                <a class="link" href="#">Esqueceu sua senha?</a>
            </div>    
            <button onclick="entrar()" class="botao" type="submit">
                Entrar
            </button>
            <div class="ou">
                <span>ou</span>
            </div>

            <button class="google" type="button">
                <span class="google-letra">G</span>
                Entrar com o Google
            </button>
        </div>

        <br>
        <div class="criar-conta">
            <p>Ainda não tem  uma conta? <a class="link" href="./cadastro.html">Cadastre-se</a></p>
        </div>

    </div>



</body>
</html>
<script>
     
    function entrar() {
        // aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                  sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./construcao.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    // finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
